submission:
  title: "GridGuard Operations Control"

  problem_statement: >
    During heavy rains and storms in Gujarat, power grid operators struggle because weather maps, asset data, and incident logs are split across totally different tools.
    When grid equipment starts failing under stress, there is no single system that can take a live storm snapshot, read the coordinates, and warn operators which transformers are at high risk.
    This makes maintenance teams purely reactive, causes long power outages, and delays crew deployment because dispatch logs are managed in messy, manual tables.
  solution_summary: >
    We built GridGuard, a web app using a Django REST Framework backend and a Vanilla HTML/CSS/JS frontend.
    When an operator uploads a satellite image, our backend extracts the data using a Python ML model file (.pkl) to calculate rainfall intensity.
    Then, the system calls the open-source Open-Meteo API to fetch live ambient data (like wind and temperature) using geographical coordinates.
    It combines this with historical JSON logs to give a localized Outage Risk percentage, and maps active repair crews to dispatch to locations.
  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Takes a satellite image upload and runs it through a Python script using Joblib and Pillow to predict rainfall in millimeters"
    - "Hits the open-source Open-Meteo API using coordinate inputs to pull real-time wind and temperature statistics automatically"
    - "Calculates a localized 0-100% Outage Risk rating using weather parameters and checks historical JSON datasets for infrastructure tolerances"
    - "Uses an algorithm that automatically triggers a closest-coordinate math loop to fallback to the nearest city's dataset if the exact location lacks an existing profile"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Django", "Django REST Framework"]
    ibm_technologies: ["IBM Bob"]
    databases: ["JSON Local Storage"]
    other: ["Joblib", "Scikit-Learn", "Numpy", "Pandas", "Pillow", "GitHub Actions"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are super proud of how we handled data gaps and API rate limits. Instead of letting the application crash if an operator selects a city that isn't in our local JSON files,
    we wrote a distance-calculation lookup loop that automatically finds and loads the nearest available city's historical infrastructure profile.
    We also managed to isolate the frontend polling and hook it to a manual 'Sync Now' event listener. This cleanly bypassed the Open-Meteo API's strict 10-second timeout rate limits so our dashboard runs stably during testing without throwing network errors.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

